name: Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Cactus engine (android-arm64)
        run: ./scripts/fetch_engine.sh

      - name: Inspect engine exports
        run: |
          NM="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          for f in engine/android-arm64/*; do
            echo "== $f"
            case "$f" in
              *.a|*.so) "$NM" -g --defined-only "$f" 2>/dev/null | grep -E ' cactus_' | sort -u || true ;;
            esac
          done

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/nimble-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/nimble-debug.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: nimble-apk
          path: out/*.apk
          if-no-files-found: error
